services:
  mikomprishoppinglistapi:
    image: mikompri.shoppinglist.api
    build:
      context: .
      dockerfile: MiKompri.ShoppingList.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - UsersApi__BaseUrl=http://mikompriusersapi:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mikompriusersapi:
    image: mikompri.users.api
    build:
      context: .
      dockerfile: MiKompri.Users.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mikompriproductcatalogapi:
    image: mikompri.productcatalog.api
    build:
      context: .
      dockerfile: MiKompri.ProductCatalog.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: MiKompri_ShoppingList
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-users-db.sql:/docker-entrypoint-initdb.d/02-init-users-db.sql
      - ./docker/init-productcatalog-db.sql:/docker-entrypoint-initdb.d/03-init-productcatalog-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
