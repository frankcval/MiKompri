services:
  mikomprishoppinglistapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=MiKompri_ShoppingList;Username=postgres;Password=12345
      - UsersApi__BaseUrl=http://mikompriusersapi:8080
      - Authentication__Authority=https://login.microsoftonline.com/a6b72a33-ade4-45d3-a2a7-52b88d96f5eb/v2.0
      - Authentication__Audience=api://36adb79e-9563-4642-8bc9-455358d76273
      - Authentication__ValidAudiences=api://36adb79e-9563-4642-8bc9-455358d76273,36adb79e-9563-4642-8bc9-455358d76273,mikompri-shoppinglist-api
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  mikompriusersapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__UsersPostgreSQL=Host=postgres;Port=5432;Database=MiKompri_Users;Username=postgres;Password=12345
      - Authentication__Authority=https://login.microsoftonline.com/a6b72a33-ade4-45d3-a2a7-52b88d96f5eb/v2.0
      - Authentication__Audience=api://36adb79e-9563-4642-8bc9-455358d76273
      - Authentication__IdentityProvider=entra
      - Authentication__ValidAudiences=api://36adb79e-9563-4642-8bc9-455358d76273,36adb79e-9563-4642-8bc9-455358d76273,mikompri-users
    ports:
      - "8082:8080"

  mikompriproductcatalogapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=MiKompri_ProductCatalog;Username=postgres;Password=12345
      - Authentication__Authority=https://login.microsoftonline.com/a6b72a33-ade4-45d3-a2a7-52b88d96f5eb/v2.0
      - Authentication__Audience=api://36adb79e-9563-4642-8bc9-455358d76273
      - Authentication__ValidAudiences=api://36adb79e-9563-4642-8bc9-455358d76273,36adb79e-9563-4642-8bc9-455358d76273,mikompri-productcatalog-api
      - ProductCatalog__Currency=EUR
    ports:
      - "8083:8080"
