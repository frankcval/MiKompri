name: CI - MiKompri Web

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*', '007-web-react-client', '008-web-ux-modernization', '009-shopping-experience-completion', '010-account-management-social-auth']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build-test-and-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MiKompri.Web
    env:
      PLAYWRIGHT_ALL_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: MiKompri.Web/package-lock.json
      - run: npm ci
      - run: npm run test:ci-config
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Mandatory controlled browser scenarios
        run: npm run test:e2e:smoke -- --workers=2 --reporter=line,html
      - run: npm run build
      - name: Docker build (TP4)
        run: docker build -t mikompri.web:ci -f MiKompri.Web/Dockerfile .
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-browser-results
          path: |
            MiKompri.Web/playwright-report/
            MiKompri.Web/test-results/
          retention-days: 7
