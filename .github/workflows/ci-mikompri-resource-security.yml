name: CI - Resource authorization and persistence
on:
  push:
    branches: [main, develop, 'feature/*', '007-web-react-client', '008-web-ux-modernization', '009-shopping-experience-completion', '010-account-management-social-auth']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relational-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: qa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test test/MiKompri.Users.Api.Tests/MiKompri.Users.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=identity-relational.trx"
        env:
          MIKOMPRI_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=qa;Pooling=false
      - run: dotnet test test/MiKompri.ShoppingList.Domain.Tests/MiKompri.ShoppingList.Domain.Tests.csproj --configuration Release
      - run: dotnet test test/MiKompri.ShoppingList.Application.Tests/MiKompri.ShoppingList.Application.Tests.csproj --configuration Release
      - run: dotnet test test/MiKompri.ShoppingList.Api.Tests/MiKompri.ShoppingList.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=relational.trx"
        env:
          MIKOMPRI_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=qa;Pooling=false
      - run: dotnet test test/MiKompri.ProductCatalog.Api.Tests/MiKompri.ProductCatalog.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=catalog-relational.trx"
        env:
          MIKOMPRI_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=qa;Pooling=false
      - run: docker build -f MiKompri.ShoppingList.Api/Dockerfile -t mikompri-shoppinglist:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relational-test-results
          path: test/**/TestResults/*.trx
